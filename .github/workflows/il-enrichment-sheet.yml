# Insight Links enriched-leads Google Sheet, every Monday. Code lives in the private dashboards repo; this public repo only holds the schedule.
# Silent on purpose (public log). Secrets: DASHBOARDS_TOKEN, N8N_WEEKLY_SECRET, GWS_CREDENTIALS.
name: Insight Links enriched leads sheet
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
concurrency:
  group: il-enrichment-sheet
jobs:
  sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thefeedmedia-org/pod-clickbaiters-dashboards
          token: ${{ secrets.DASHBOARDS_TOKEN }}
          path: repo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write the sheet
        working-directory: repo
        env:
          N8N_WEEKLY_SECRET: ${{ secrets.N8N_WEEKLY_SECRET }}
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
        run: |
          set +e
          npm install -g @googleworkspace/cli@0.22.5 --no-audit --no-fund > /dev/null 2>&1
          umask 077
          printf '%s' "$GWS_CREDENTIALS" > "$RUNNER_TEMP/gws.json"
          export GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE="$RUNNER_TEMP/gws.json" GOOGLE_WORKSPACE_CLI_CONFIG_DIR="$RUNNER_TEMP/gws" KEYRING_BACKEND=file GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND=file
          node pod/weekly-n8n/raw/il-enrichment-sheet.mjs > /dev/null 2>&1
          code=$?
          rm -f "$RUNNER_TEMP/gws.json"
          echo "exit $code"
          exit $code
      - name: Keep the schedules on
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARDS_TOKEN }}
        run: for w in snopes-daily.yml il-enrichment-sheet.yml; do gh workflow enable "$w" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || true; done
